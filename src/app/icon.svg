<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- "SD" monogram in ocean greens, with a small orbiting dot -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2a2c" />
      <stop offset="1" stop-color="#03100f" />
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#99f6e4" />
      <stop offset="0.5" stop-color="#2dd4bf" />
      <stop offset="1" stop-color="#0d9488" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.9" />
      <stop offset="1" stop-color="#5eead4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#tile)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#2dd4bf" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- orbit arc + satellite dot -->
  <path d="M9 52 A30 13 -28 0 1 55 13" fill="none" stroke="#5eead4" stroke-opacity="0.35" stroke-width="1.4" stroke-linecap="round" />
  <circle cx="54.5" cy="12.5" r="6" fill="url(#glow)" />
  <circle cx="54.5" cy="12.5" r="2.6" fill="#ccfbf1" />

  <!-- S -->
  <path
    d="M28 22.5 C26.4 19.6 23.2 18.5 19.6 18.5 C14.4 18.5 11.2 21.3 11.2 25.2 C11.2 29.6 15.4 30.9 19.6 31.9 C24.3 33 28.6 34.4 28.6 39.4 C28.6 43.4 25.2 46 19.8 46 C15.8 46 12.6 44.6 10.8 41.6"
    fill="none" stroke="url(#ink)" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round" />
  <!-- D -->
  <path
    d="M36.4 18.8 V45.7 H42.8 C50 45.7 54.2 40.3 54.2 32.25 C54.2 24.2 50 18.8 42.8 18.8 Z"
    fill="none" stroke="url(#ink)" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
